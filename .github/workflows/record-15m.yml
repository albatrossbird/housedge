name: Record 15-minute markets

# THE BOX RUNS THIS NOW, and this job is the one it replaced. Its
# schedule is off — see the `on:` block below for the measurement that
# decided it — and what remains is a manual fallback for while the box
# is down.
#
# Every row in m15_quotes is stamped with which recorder wrote it
# (migration 0023), which is what made the comparison possible at all:
# a union figure cannot tell "the box covers everything" from "the box
# covers half". Running this by hand alongside the box is safe —
# append-only and write-on-change, so two recorders cost duplicate rows
# and never a gap.
#
# Kalshi lists exactly ONE open market per 15-minute series at a time,
# and it lives for fifteen minutes. That single fact decides everything
# about this job.
#
# WHY IT DOES NOT RUN ON VERCEL. A useful sample of a fifteen-minute
# market needs polling every ~15 seconds. Through a serverless function
# that is ~240 invocations an hour against the Hobby plan's 4 CPU-hours
# a MONTH — a day of data would cost a month of budget. Actions minutes
# are free and unmetered on a public repo and a job may run six hours,
# so the loop lives in the runner and talks to Kalshi and Supabase
# directly, the same way match-markets.yml already does.
#
# WHY IT OVERLAPS ON PURPOSE. GitHub does not honour short cron
# intervals — measured gaps on this repo run 45 minutes to 3.5 hours —
# so a schedule that assumes punctuality would leave holes exactly as
# long as the delay. Each run therefore covers 55 minutes and the
# schedule asks for every 30, so a late start still lands inside the
# previous run's window. Writes are append-only and write-on-change, so
# two overlapping recorders cost duplicate rows at worst, never a gap.
#
# 330 MINUTES, NOT 55, AND THE REASON IS MEASURED.
#
# 55 was sized against the cron this file ASKS for (*/30). Measured
# 2026-09-09, the cron it GETS has gaps of 1.9 to 5.4 hours, averaging
# about 3.5. A 55-minute run inside a 3.5-hour gap is a ~26% duty
# cycle, and the data agrees exactly: of the 300 most recent gold
# markets, only 87 (29%) had any quotes at all.
#
# Three quarters of every window was going unrecorded, PERMANENTLY — a
# settled market reports only its last price, so an unwatched window is
# gone rather than delayed. That is the one asset here that cannot be
# bought or backfilled, and it was accruing at a quarter speed for want
# of a number.
#
# 330 minutes outlives even the 5.4-hour gap observed, so runs overlap
# instead of leaving holes. Overlap is already safe and already
# intended — the concurrency group is keyed on run_id, so nothing
# blocks a second recorder, and duplicate rows are the documented worst
# case. Actions minutes are free and unmetered on a public repo, so
# four times the coverage costs nothing.
#
# WATCH STORAGE. At ~26% this wrote roughly 50k rows a day; at full
# coverage expect nearer 190k, which is ~70M rows a year and real
# pressure against Supabase Pro's 8GB. Retention on m15_quotes is the
# next decision, not an emergency — but it IS a decision, and the time
# to make it is before the table forces it.

on:
  # SCHEDULE OFF, 2026-09-26, ON MEASUREMENT. The box now records this
  # family, and the per-source check says it does so alone:
  #
  #   box                4164 windows   100.0%
  #   actions            4164 windows   100.0%
  #   union              4164 windows   100.0%
  #   VERDICT: the box alone covers 100.0%, matching the union.
  #
  # over a 48-hour window ('M15 coverage' workflow, run 11). Every
  # window this job caught, the box caught too, so what it adds is
  # duplicate rows and Actions minutes — and those minutes are what
  # keeps this repository public.
  #
  # TURNED OFF BY DELETING THE SCHEDULE, NOT THE JOB. workflow_dispatch
  # stays, so bringing this back is one click and no commit: the box is
  # one machine, and a recorder whose data cannot be backfilled needs a
  # way to run somewhere else while that machine is down.
  #
  # BEFORE UNCOMMENTING, RE-RUN 'M15 coverage'. A schedule turned back
  # on because it feels safer, against a box that is in fact fine, is
  # the state this measurement exists to replace.
  #
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to record for"
        default: "330"
        required: false
      pollSeconds:
        description: "Seconds between polls"
        default: "15"
        required: false

# Deliberately NOT cancel-in-progress: killing the running recorder to
# start a fresh one would open a gap at every schedule tick.
concurrency:
  group: record-15m-${{ github.run_id }}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Record live 15-minute quotes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          M15_RUN_MINUTES: ${{ github.event.inputs.minutes || '330' }}
          M15_POLL_SECONDS: ${{ github.event.inputs.pollSeconds || '15' }}
          # The other half of the overlap. See migration 0023.
          M15_SOURCE: actions
        run: node scripts/m15-record.mjs
