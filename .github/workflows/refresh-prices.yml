name: Refresh prices

# Keeps market prices current. This is what fixes "the site shows a
# price that's hours old" — /api/refresh works, nothing was calling it.
#
# WHY GITHUB ACTIONS RATHER THAN VERCEL CRON:
# Vercel's Hobby plan caps cron frequency at once per DAY, which would
# leave prices up to 24h stale — not a fix. This repo is public, so
# Actions minutes are free and unmetered, with no cap beyond the
# scheduler's 5-minute minimum. If the project moves to Vercel Pro, a
# `crons` entry in vercel.json is a tidier home and this can be deleted.
#
# Scheduled runs are best-effort: GitHub delays them under load, so this
# is a floor on freshness, not a promise. The page tops it up on demand
# (see /api/refresh?ifStale=), which is what covers the case that
# matters: someone is looking at it right now.

on:
  schedule:
    # GitHub does not honour this: measured gaps between scheduled runs
    # on this public repo were 45 minutes to 3.5 hours. Asking for */5
    # rather than */15 does not make it five minutes -- it just means the
    # throttle has something to throttle. The reliable ways to get a real
    # interval are an external cron hitting /api/refresh (cron-job.org
    # runs every minute, free) or Vercel Pro, whose crons have a 1-minute
    # minimum.
    #
    # THE JOB NO LONGER RUNS ON VERCEL. It used to curl /api/refresh,
    # which made every tick a serverless invocation — measured
    # 2026-09-07 as the dominant consumer of the Hobby plan's 4 Fluid
    # Active CPU-hours a month, at 3 of 4 used, on cron traffic hitting
    # our own API with essentially no visitors. The loop runs here now,
    # like match-markets.yml and the m15 jobs. The ROUTE is untouched
    # and still serves the browser's on-demand refresh. The page also asks for a refresh of its own when what it
    # is showing is over three minutes old, which covers the case that
    # actually matters: someone is looking at it.
    - cron: "*/5 * * * *"   # UTC

  workflow_dispatch:          # manual trigger from the Actions tab

concurrency:
  # A slow run must not overlap the next tick.
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/refresh-prices.mjs
