# Per-source coverage for the 15-minute recorder.
#
# Exists so the "can Actions be turned off" question can be asked from
# anywhere, including from a phone, without SSH to the box and without
# credentials on the asker's machine. workflow_dispatch only — this is a
# question you ask, not an alarm; watchdog.yml is the alarm.
#
# Reads only. See migration 0023_m15_quotes_source.sql for why union
# coverage cannot answer the question on its own.
name: M15 coverage

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Window to report over, in hours"
        required: false
        default: "48"

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coverage by source
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/m15-coverage.mjs --hours=${{ github.event.inputs.hours || '48' }}
