# Record Kalshi's daily temperature ladders and the NWS forecast.
#
# WHY BOTH, TOGETHER. The book alone cannot say whether a price was
# wrong; the forecast alone cannot say whether anyone disagreed. The
# question this dataset exists to answer — was Kalshi mispriced against
# what was knowable at the time — needs the two side by side, stamped,
# from before the outcome was known.
#
# Neither half is backfillable. A settled Kalshi market reports one last
# price, and NWS serves the CURRENT forecast, never the one it was
# issuing yesterday afternoon.
#
# 330 MINUTES, learned from the m15 recorder rather than rediscovered:
# this repo asks for */30 and GETS gaps of 1.9 to 5.4 hours, so a
# 55-minute run was recording ~26% of the time. Runs are meant to
# overlap; the concurrency group is keyed on run_id so nothing blocks a
# second recorder, and writes are append-only and write-on-change.
#
# The poll is every 10 MINUTES, not 15 seconds: a daily temperature
# market moves on forecast revisions and order flow, not tick by tick,
# and NWS issues a handful of times a day. The forecast is fetched on
# its own hourly clock inside the loop.
#
# THE BOX RUNS THIS NOW, and this job is the one it replaced. Its
# schedule is off — see the `on:` block below for the measurement that
# decided it — and what remains is a manual fallback for while the box
# is down. Every row in wx_quotes is stamped with which recorder wrote
# it (migration 0026), which is what made the comparison possible: a
# union figure cannot tell "the box covers everything" from "the box
# covers half". Running this by hand alongside the box is safe —
# append-only and write-on-change, so two recorders cost duplicate rows
# and never a gap.
#
name: Record weather markets

on:
  # SCHEDULE OFF, 2026-09-28, ON MEASUREMENT. The box now records this
  # family, and the per-source check says it does so alone:
  #
  #   source        hours seen   coverage   longest gap
  #   box                   48     100.0%           10m
  #   actions               45      93.8%          161m
  #   union                 48     100.0%           10m
  #   VERDICT: the box alone covers 100.0%, matching the union.
  #
  # over a 48-hour window ('Weather coverage' workflow, run 1). The box
  # never went more than one 10-minute poll without a row; this job's
  # longest silence was 2h41m. What it adds is duplicate rows and the
  # largest share of this repository's Actions minutes.
  #
  # TURNED OFF BY DELETING THE SCHEDULE, NOT THE JOB. workflow_dispatch
  # stays, so bringing this back is one click and no commit: the box is
  # one machine, and a recorder whose data cannot be backfilled needs a
  # way to run somewhere else while that machine is down.
  #
  # BEFORE UNCOMMENTING, RE-RUN 'Weather coverage'. A schedule turned
  # back on because it feels safer, against a box that is in fact fine,
  # is the state this measurement exists to replace.
  #
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to record for"
        default: "330"
        required: false
      pollMinutes:
        description: "Minutes between ladder polls"
        default: "10"
        required: false

concurrency:
  group: record-weather-${{ github.run_id }}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No `npm ci`: the script talks to Kalshi, NWS and Supabase over
      # plain fetch, like the m15 and refresh scripts.
      - name: Record weather ladders and forecasts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WX_RUN_MINUTES: ${{ github.event.inputs.minutes || '330' }}
          WX_POLL_MINUTES: ${{ github.event.inputs.pollMinutes || '10' }}
        run: node scripts/wx-record.mjs
