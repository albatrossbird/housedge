name: Backtest 15-minute strategies

# source=poller: scripts/m15-backtest.mjs over the 15-second poller's
# live-book path in Postgres (from 2026-09-26).
# source=archive: scripts/m15-archive-backtest.mjs over the WebSocket
# archive's once-a-second book in Storage; one small database read.
# source=rulebook: scripts/m15-rulebook-backtest.mjs runs a rule file
# (strategies/*.json) tick by tick over the same archive, with Coinbase
# candles for the Bitcoin signals; every action goes up as an artifact.
# Manual only, and run one at a time — not 15:45-16:45 UTC, while
# discovery and matching load the database.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "poller (15-second path, Postgres), archive (1-second book, Storage), or rulebook (a strategies/*.json file over the archive)"
        type: choice
        options: [poller, archive, rulebook]
        default: poller
      series:
        description: "Space-separated series"
        default: "KXBTC15M KXGOLD15M"
        required: false
      strategies:
        description: "Comma-separated presets (fav-late, fav-final, dog-late, fav-mid-managed, momentum, fade) or all"
        default: "all"
        required: false
      strategy:
        description: "Optional custom strategy as JSON, or a map of named ones {\"a\":{...},\"b\":{...}} (see PRESETS in lib/m15Backtest.js); runs instead of the presets"
        default: ""
        required: false
      size:
        description: "Contracts per entry"
        default: "10"
        required: false
      days:
        description: "How far back (poller: live book from 2026-09-26; archive: capped at 30)"
        default: "21"
        required: false
      maker:
        description: "archive only: also run each decision as a resting order, replayed change by change (lib/m15Maker.js)"
        type: boolean
        default: false
      venues:
        description: "archive only: also run the rules on Polymarket US's book (Bitcoin), alone and best of both (lib/m15Venues.js)"
        type: boolean
        default: false
      file:
        description: "rulebook only: the rule file"
        default: "strategies/momentum-ladder.json"
        required: false

concurrency:
  group: m15-analysis
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # The recorded archives are private (migration 0028).
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Inputs go through env, never into the shell line: ${{ }} is
          # substituted as raw text before bash parses it.
          SERIES: ${{ github.event.inputs.series || 'KXBTC15M KXGOLD15M' }}
          STRATEGIES: ${{ github.event.inputs.strategies || 'all' }}
          STRATEGY: ${{ github.event.inputs.strategy }}
          SIZE: ${{ github.event.inputs.size || '10' }}
          DAYS: ${{ github.event.inputs.days || '21' }}
          SOURCE: ${{ github.event.inputs.source || 'poller' }}
          MAKER: ${{ github.event.inputs.maker }}
          VENUES: ${{ github.event.inputs.venues }}
          RULEFILE: ${{ github.event.inputs.file || 'strategies/momentum-ladder.json' }}
        run: |
          if [ "$SOURCE" = "rulebook" ]; then
            node scripts/m15-rulebook-backtest.mjs "--file=$RULEFILE" "--days=$DAYS" --out=rulebook-actions.tsv
            exit $?
          fi
          SCRIPT=scripts/m15-backtest.mjs
          EXTRA=""
          if [ "$SOURCE" = "archive" ]; then
            SCRIPT=scripts/m15-archive-backtest.mjs
            if [ "$MAKER" = "true" ]; then EXTRA="--maker"; fi
            if [ "$VENUES" = "true" ]; then EXTRA="$EXTRA --venues"; fi
          elif [ "$MAKER" = "true" ] || [ "$VENUES" = "true" ]; then
            echo "::warning::resting orders and the venue comparison need the WebSocket archives; ignored for source=poller"
          fi
          if [ -n "$STRATEGY" ]; then
            node "$SCRIPT" "--days=$DAYS" "--size=$SIZE" "--strategy=$STRATEGY" $EXTRA $SERIES
          else
            node "$SCRIPT" "--days=$DAYS" "--size=$SIZE" "--strategies=$STRATEGIES" $EXTRA $SERIES
          fi
      - name: Upload the rule file's actions
        if: ${{ always() && github.event.inputs.source == 'rulebook' }}
        uses: actions/upload-artifact@v4
        with:
          name: rulebook-actions
          path: rulebook-actions.tsv
          if-no-files-found: ignore
          retention-days: 14
