name: Discover and match markets

# The expensive counterpart to refresh-prices: fetches new markets from
# both venues, embeds the non-sports ones, and recomputes matches.
#
# Daily rather than every 15 minutes because it spends Voyage tokens and
# does full re-matching. New sports fixtures appear daily, which sets the
# useful floor; econ/crypto/politics move far slower than that.
#
# Categories run SEQUENTIALLY with a pause between them. Each /api/embed
# call is a long-running serverless function, and firing all seven at once
# risks Vercel concurrency and duration limits — the failure mode being a
# half-written match set, which is worse than a slow job.

on:
  schedule:
    - cron: "20 9 * * *"    # 09:20 UTC daily
  workflow_dispatch:
    inputs:
      categories:
        description: "Space-separated categories to run"
        default: "mlb nba nhl soccer econ crypto politics"
        required: false

concurrency:
  group: discover-markets
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Run /api/embed per category
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CATEGORIES: ${{ github.event.inputs.categories || 'mlb nba nhl soccer econ crypto politics' }}
        run: |
          set -uo pipefail
          FAILED=0

          # TWO STAGES PER CATEGORY, not one call.
          #
          # Politics cannot do fetch + embed + match inside Vercel's 300s
          # ceiling: matching that category alone takes over two minutes,
          # and the combined run returned no body at all, so the category
          # could not be rebuilt. Fetching and matching read different
          # things -- the venues, then Supabase -- so they split cleanly
          # across two invocations.
          #
          # The fetch stage is also re-runnable on its own: embedding is
          # capped per call and `embedRemaining` says what is left, so a
          # category with thousands of changed titles converges over
          # repeated runs instead of dying.
          for CAT in $CATEGORIES; do
            echo "::group::$CAT"

            if ! curl -sS --max-time 280 \
                ${CRON_SECRET:+-H "Authorization: Bearer $CRON_SECRET"} \
                "https://housedge.vercel.app/api/embed?fetchonly=1&sport=$CAT" -o "fetch-$CAT.json"; then
              echo "::error::$CAT: fetch stage curl failed"
              FAILED=1
              echo "::endgroup::"
              continue
            fi

            if ! jq -e . "fetch-$CAT.json" >/dev/null 2>&1; then
              echo "::error::$CAT: fetch stage response was not valid JSON"
              FAILED=1
              echo "::endgroup::"
              continue
            fi

            jq -r '"'"$CAT"' fetch: embedded=\(.embedded) remaining=\(.embedRemaining) marketsUpserted=\(.writes.marketsUpserted // "n/a")"' "fetch-$CAT.json"
            REMAINING=$(jq -r '.embedRemaining // 0' "fetch-$CAT.json")
            if [ "$REMAINING" -gt 0 ]; then
              echo "::warning::$CAT: $REMAINING titles still need embedding; next run continues"
            fi

            sleep 10

            # Non-sports matching now runs in match-markets.yml, on a
            # runner with no 300s ceiling. Politics does not fit here any
            # more (12,210 x 5,458 comparisons), and keeping the call
            # would fail this job every day for a category another
            # workflow is already handling. Sports still matches here:
            # it is an exact join, not a similarity sweep, and it is
            # fast.
            case " mlb nba nhl soccer " in
              *" $CAT "*) ;;
              *)
                echo "$CAT: fetch done — matching runs in match-markets.yml"
                echo "::endgroup::"
                sleep 20
                continue
                ;;
            esac

            if ! curl -sS --max-time 280 \
                ${CRON_SECRET:+-H "Authorization: Bearer $CRON_SECRET"} \
                "https://housedge.vercel.app/api/embed?matchonly=1&sport=$CAT" -o "resp-$CAT.json"; then
              echo "::error::$CAT: match stage curl failed"
              FAILED=1
              echo "::endgroup::"
              continue
            fi

            head -c 1200 "resp-$CAT.json"; echo

            if ! jq -e . "resp-$CAT.json" >/dev/null 2>&1; then
              echo "::error::$CAT: response was not valid JSON"
              FAILED=1
            elif jq -e '.error' "resp-$CAT.json" >/dev/null 2>&1; then
              echo "::error::$CAT: $(jq -r '.error' "resp-$CAT.json")"
              FAILED=1
            else
              jq -r '"'"$CAT"' match: newPairs=\(.newPairs) totalPairs=\(.totalPairs)"' "resp-$CAT.json"

              # Write errors are what silently produced empty results for
              # most of this project's history — surface, never swallow.
              jq -r '[(.writes.marketsErrors // []), (.writes.embeddingErrors // []), (.writes.pairsErrors // [])] | add[:3][]? | "::warning::" + .' "resp-$CAT.json" || true
            fi

            echo "::endgroup::"
            sleep 20   # space out long serverless calls
          done

          # Retention, after discovery rather than before: discovery
          # refreshes updated_at on everything the venues still list, so
          # running it first is what makes "not seen in N days" mean
          # "delisted" instead of "not fetched yet".
          echo "::group::prune"
          if curl -sS --max-time 280 \
              ${CRON_SECRET:+-H "Authorization: Bearer $CRON_SECRET"} \
              "https://housedge.vercel.app/api/prune" -o prune.json; then
            head -c 600 prune.json; echo
            if jq -e '.error' prune.json >/dev/null 2>&1; then
              echo "::warning::prune: $(jq -r '.error' prune.json)"
            else
              jq -r '"pruned \(.deleted) of \(.marketsScanned) markets, \(.pairsProtecting) protected"' prune.json
              jq -r '(.errors // [])[:3][] | "::warning::prune: " + .' prune.json || true
            fi
          else
            echo "::warning::prune: curl failed"
          fi
          echo "::endgroup::"

          exit $FAILED
