name: Discover and match markets

# The expensive counterpart to refresh-prices: fetches new markets from
# both venues, embeds the non-sports ones, and recomputes matches.
#
# Daily rather than every 15 minutes because it spends Voyage tokens and
# does full re-matching. New sports fixtures appear daily, which sets the
# useful floor; econ/crypto/politics move far slower than that.
#
# THE JOB NO LONGER RUNS ON VERCEL. It used to curl /api/embed twice per
# category plus /api/prune; politics alone spends 86-109s of that, and
# measured 2026-09-07 the job was the second largest consumer of the
# Hobby plan's 4 Fluid Active CPU-hours a month, after the price
# refresh. Reading two venues, calling Voyage and writing Supabase does
# not need a serverless function. The ROUTES are kept so the endpoints
# stay hittable by hand, and both callers run the same functions.
#
# Categories still run SEQUENTIALLY: firing them concurrently at Kalshi
# and Polymarket would draw the rate limiting both venues apply to
# datacenter IPs, and a half-written match set is worse than a slow job.
#
# This one DOES need `npm ci` where the m15 and refresh scripts do not:
# lib/discover.js reads through supabase-js in a dozen places, and
# rewriting all of them as REST would be a large change to the most
# heavily commented file in the repo. Once a day, ~20s, is a fair price.

on:
  schedule:
    - cron: "20 9 * * *"    # 09:20 UTC daily
  workflow_dispatch:
    inputs:
      categories:
        description: "Space-separated categories to run"
        default: "mlb nfl ncaaf nba nhl soccer econ crypto politics"
        required: false

concurrency:
  group: discover-markets
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - name: Discover, match and prune
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          CATEGORIES: ${{ github.event.inputs.categories || 'mlb nfl ncaaf nba nhl soccer econ crypto politics' }}
        run: node scripts/discover.mjs
