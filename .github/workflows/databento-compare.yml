# CME futures from Databento against the Pyth prices Kalshi's commodity
# and FX 15-minute markets settle on (m15_settlements). Same scoring as
# the Dukascopy comparison: level, side, and side on the windows nearest
# the strike. scripts/databento-fetch.py has the why.
#
# SPENDS DATABENTO CREDIT. Historical data is usage-based with no
# subscription; the account's $125 sign-up credit pays for it. The fetch
# asks Databento for the cost of everything it does not already hold and
# buys NOTHING if that is over max_usd. What it buys is kept in the
# Actions cache, so a re-run (or a failed compare) costs nothing and a
# later run buys only the days since. `dry` prints the quote only.
#
# Writes nothing to Supabase. Needs DATABENTO_API_KEY, SUPABASE_URL and
# SUPABASE_SERVICE_ROLE_KEY as repository secrets.
name: Databento vs Pyth

on:
  workflow_dispatch:
    inputs:
      from:
        description: "First day (UTC). Kalshi lists settled markets back ~10 weeks; m15_settlements keeps them after"
        default: "2026-08-18"
        required: false
      max_usd:
        description: "Stop before buying anything if Databento quotes more than this"
        default: "25"
        required: false
      schema:
        description: "auto = one-second bars if they fit under max_usd, else one-minute"
        type: choice
        options: [auto, ohlcv-1s, ohlcv-1m]
        default: auto
      dry:
        description: "Print the quote only, buy nothing"
        type: boolean
        default: false

concurrency:
  group: databento
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Databento client
        run: pip install --quiet databento==0.87.0
      # Before any money moves: the code that picks each boundary's price
      # and decides what is still to buy.
      - name: Tests
        run: |
          python3 scripts/databento-fetch.test.py
          node scripts/databento.test.mjs
      - name: Restore what was already bought
        uses: actions/cache/restore@v4
        with:
          path: databento
          key: databento-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: databento-
      # Inputs go through env and are quoted, never interpolated into the
      # command line: `${{ }}` is raw text substitution before bash parses
      # it, so a value with a semicolon would run on a runner holding keys.
      - name: Quote, then buy
        id: fetch
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          FROM: ${{ github.event.inputs.from || '2026-08-18' }}
          MAX_USD: ${{ github.event.inputs.max_usd || '25' }}
          SCHEMA: ${{ github.event.inputs.schema || 'auto' }}
          DRY: ${{ github.event.inputs.dry }}
        run: |
          args=(--dir=databento "--from=$FROM" "--max-usd=$MAX_USD" "--schema=$SCHEMA")
          if [ "$DRY" = "true" ]; then args+=(--dry); fi
          python3 scripts/databento-fetch.py "${args[@]}"
      # Saved even when the compare step fails, so nothing is bought twice.
      - name: Keep what was bought
        if: always() && steps.fetch.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: databento
          key: databento-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Compare with Kalshi's settlement prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/databento-compare.mjs --dir=databento
