# CME futures from Databento against the Pyth prices Kalshi's commodity
# and FX 15-minute markets settle on (m15_settlements). Same scoring as
# the Dukascopy comparison: level, side, and side on the windows nearest
# the strike. scripts/databento-fetch.py has the why.
#
# SPENDS DATABENTO CREDIT, BUT ONLY WHEN `dry` IS UNTICKED. The default
# run prints Databento's own quote for everything not already held and
# buys nothing. Buying is a second run at a price someone has seen, and
# even then nothing is bought over max_usd.
#
# WHAT IS BOUGHT IS KEPT. Every raw file goes to the private bucket
# (stream-archive/databento/, scripts/databento-store.mjs) and the push
# fails the run unless each one is there at full size. Storage, not the
# Actions cache, decides what is held: the cache forgets after 7 days
# unread, and a raw file this run cannot find is a raw file it would buy
# again.
#
# Needs DATABENTO_API_KEY, SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as
# repository secrets.
name: Databento vs Pyth

on:
  workflow_dispatch:
    inputs:
      schema:
        description: "bbo-1s = best bid/offer each second; ohlcv-1s / ohlcv-1m = trade bars"
        type: choice
        options: [bbo-1s, ohlcv-1s, ohlcv-1m]
        default: bbo-1s
      dry:
        description: "Quote only, buy nothing (untick to buy at the quoted price)"
        type: boolean
        default: true
      max_usd:
        description: "Never buy if Databento quotes more than this"
        default: "25"
        required: false
      from:
        description: "First day (UTC). Kalshi lists settled markets back ~10 weeks; m15_settlements keeps them after"
        default: "2026-08-18"
        required: false

concurrency:
  group: databento
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Databento client
        run: pip install --quiet databento==0.87.0
      # Before any money moves: the code that picks each boundary's price
      # and decides what is still to buy.
      - name: Tests
        run: |
          python3 scripts/databento-fetch.test.py
          node scripts/databento.test.mjs
      - name: Restore from the Actions cache (a speed-up only)
        uses: actions/cache/restore@v4
        with:
          path: databento
          key: databento-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: databento-
      - name: Pull what was bought from Storage
        run: node scripts/databento-store.mjs pull --dir=databento
      # Inputs go through env and are quoted, never interpolated into the
      # command line: `${{ }}` is raw text substitution before bash parses
      # it, so a value with a semicolon would run on a runner holding keys.
      - name: Quote, then buy
        id: fetch
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          SCHEMA: ${{ github.event.inputs.schema || 'bbo-1s' }}
          DRY: ${{ github.event.inputs.dry || 'true' }}
          MAX_USD: ${{ github.event.inputs.max_usd || '25' }}
          FROM: ${{ github.event.inputs.from || '2026-08-18' }}
        run: |
          args=(--dir=databento "--schema=$SCHEMA" "--from=$FROM" "--max-usd=$MAX_USD")
          if [ "$DRY" != "false" ]; then args+=(--dry); fi
          python3 -u scripts/databento-fetch.py "${args[@]}"
      # Even when the fetch failed part way: every piece it finished was
      # paid for.
      - name: Push what was bought to Storage
        if: always() && steps.fetch.outcome != 'skipped'
        run: node scripts/databento-store.mjs push --dir=databento
      - name: Keep a copy in the Actions cache
        if: always() && steps.fetch.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: databento
          key: databento-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Compare with Kalshi's settlement prices
        run: node scripts/databento-compare.mjs --dir=databento
